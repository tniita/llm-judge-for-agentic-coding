[project]
name = "llm-judge-service"
version = "0.1.0"
description = "コーディングエージェントの PR を実験単位で採点・比較する LLM Judge の評価サービス（Foundry Hosted Agent、Invocations プロトコル）"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-agentserver-core==2.3.0",
    "azure-ai-agentserver-invocations==1.3.0",
    "azure-ai-projects==2.10.0",
    "azure-identity==1.27.0",
    "azure-cosmos==4.17.1",
    "azure-keyvault-secrets==4.12.0",
    "openai==3.60.0",
    # OpenTelemetry の openai 計装が httpx を import する（Foundry のサンプルと同じ）
    "httpx<1",
]
